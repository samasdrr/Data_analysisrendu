name: CI/CD Pipeline simple

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer Python et les outils
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 pytest

      # 1. FORMATAGE (Vérifie l'esthétique du code)
      - name: Vérifier le format (Black)
        run: |
          black --check src/ tests/ || true

      # 2. LINT (Vérifie les erreurs de code et la propreté)
      - name: Vérifier le linter (Flake8)
        run: |
          flake8 src/ tests/ --count --max-line-length=130 --statistics || true

      # 3. TEST (Vérifie que les fonctions marchent - CI)
      - name: Lancer les tests (Pytest)
        run: |
          python -m unittest discover -s tests -p "test_*.py"
